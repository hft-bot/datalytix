  <!-- author -->

  <!-- Organization schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Bytolix",
    "url": "https://bytolix.com",
    "logo": "https://bytolix.com/images/bytolix-logo.png",
    "description": "Bytolix builds and deploys autonomous AI agents for enterprise — multi-agent orchestration, RAG systems, agentic workflow automation, and AI copilots.",
    "foundingDate": "2024",
    "email": "hello@bytolix.com",
    "sameAs": [
      "https://www.linkedin.com/company/bytolix",
      "https://twitter.com/bytolix"
    ],
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "IN"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "sales",
      "email": "hello@bytolix.com",
      "availableLanguage": "English"
    }
  }
  </script>

  <!-- WebSite schema with SearchAction -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Bytolix",
    "url": "https://bytolix.com",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://bytolix.com/blog?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- ProfessionalService schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",

    "url": "https://bytolix.com",

    "priceRange": "$$$$",
    "areaServed": "Worldwide",
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Agentic AI Services",
      "itemListElement": [
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Multi-Agent Orchestration", "url": "https://bytolix.com/services/multi-agent-orchestration.html"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "RAG Systems & Knowledge Agents", "url": "https://bytolix.com/services/rag-systems.html"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Agentic Workflow Automation", "url": "https://bytolix.com/services/agentic-workflow-automation.html"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "AI Copilots & Enterprise Chatbots", "url": "https://bytolix.com/services/ai-copilots.html"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "AI Strategy & Agent Roadmap", "url": "https://bytolix.com/services/ai-strategy.html"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "AI Governance & Agent Observability", "url": "https://bytolix.com/services/ai-governance.html"}}
      ]
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "5.0",
      "reviewCount": "4",
      "bestRating": "5"
    },
    "review": [
      {
        "@type": "Review",
        "reviewRating": {"@type": "Rating", "ratingValue": "5"},
        "author": {"@type": "Person", "name": "Founder, Zari & Zen"},
        "reviewBody": "Bytolix didn't just consult — they embedded engineers who actually shipped autonomous agents into our e-commerce ops."
      },
      {
        "@type": "Review",
        "reviewRating": {"@type": "Rating", "ratingValue": "5"},
        "author": {"@type": "Person", "name": "CTO, Flowkon"},
        "reviewBody": "Bytolix designed the agent architecture, built the pipeline, and it's been running in production for 6 months. Campaign performance up 3x."

  <!-- FAQ schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is agentic AI?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Agentic AI refers to AI systems that can reason, plan, use tools, and complete multi-step tasks autonomously without human intervention at each step. Unlike traditional chatbots, AI agents can execute workflows, call APIs, process data, and make decisions independently."
        }
      },
      {
        "@type": "Question",
        "name": "How long does it take to deploy an AI agent?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Bytolix can deploy your first production AI agent in as little as 2 weeks, depending on complexity. Our 4-step process — Discovery, Architecture Design, Build & Evaluate, and Deploy — is optimised for speed without sacrificing reliability."
        }
      },
      {
        "@type": "Question",
        "name": "What frameworks does Bytolix use to build AI agents?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Bytolix builds AI agents using LangGraph, CrewAI, AutoGen, and custom Python orchestration layers. We use LlamaIndex and Pinecone for RAG systems, and integrate with Claude API, GPT-4o, and other leading LLMs depending on the use case."
        }
      },
      {
        "@type": "Question",
        "name": "What industries does Bytolix serve?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Bytolix deploys AI agents across Finance, Sales & Marketing, HR & Legal, Operations, and Data & Analytics. We serve enterprises across e-commerce, fintech, SaaS, and professional services globally."
        }
      },
      {
        "@type": "Question",
        "name": "How much does agentic AI development cost?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Bytolix pricing depends on the scope of the agent system. A focused single-agent deployment starts from a fixed project fee, while enterprise multi-agent orchestration systems are scoped during discovery. Book a free 30-minute call to get a scoped estimate."
        }
      }
    ]
  }
  </script>
